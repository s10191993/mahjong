<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>線上麻將 · 台灣 16 張</title>
  <!-- 加到主畫面後以 App 模式全螢幕執行（iPhone Safari 沒有網頁全螢幕 API）-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="線上麻將">
  <meta name="theme-color" content="#0a5738">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 大廳 -->
  <section id="lobby" class="screen active">
    <div class="card">
      <h1 id="lobby-title">🀄 線上麻將</h1>
      <p class="sub" id="lobby-sub">台灣 16 張 · 跟朋友連線對戰</p>
      <div class="game-pick">
        <button type="button" class="gp active" data-game="mahjong">🀄 麻將</button>
        <button type="button" class="gp" data-game="poker">🃏 德州撲克</button>
      </div>
      <label>你的暱稱
        <input id="name-input" maxlength="12" placeholder="輸入暱稱" autocomplete="off">
      </label>
      <button id="btn-create" class="primary">開新房間</button>
      <div class="divider"><span>或</span></div>
      <label>房間代碼
        <input id="code-input" maxlength="4" placeholder="4 碼英文" autocomplete="off"
               style="text-transform:uppercase">
      </label>
      <button id="btn-join">加入房間</button>
      <p id="lobby-err" class="err"></p>
    </div>
  </section>

  <!-- 等待室 -->
  <section id="waiting" class="screen">
    <div class="card wait-card">
      <div class="wait-col">
        <h2>房間代碼</h2>
        <div id="room-code" class="room-code">----</div>
        <p class="sub">把代碼給朋友，讓他們加入</p>
        <button id="btn-copy" class="ghost">複製代碼</button>
        <ul id="seat-list" class="seat-list"></ul>
      </div>
      <div class="wait-col">

      <div id="settings" class="settings">
        <!-- 德州設定 -->
        <div id="poker-cfg" style="display:none">
          <div class="set-row">
            <label>小盲<input id="cfg-sb" type="number" min="1" step="5" value="10"></label>
            <label>大盲<input id="cfg-bb" type="number" min="1" step="10" value="20"></label>
          </div>
          <label>起始籌碼<input id="cfg-stack" type="number" min="10" step="100" value="1000"></label>
          <label class="toggle">
            <input id="cfg-bounty27" type="checkbox" checked>
            <span>2·7 獎金<small>（手拿 2·7 收池／秀牌，每家付 2.5 個大盲）</small></span>
          </label>
        </div>
        <!-- 麻將設定 -->
        <div id="mj-cfg">
        <div class="set-row">
          <label>底<input id="cfg-base" type="number" min="0" step="10" value="100"></label>
          <label>每台<input id="cfg-tai" type="number" min="0" step="5" value="20"></label>
        </div>
        <label>打幾圈
          <select id="cfg-rounds">
            <option value="1">1 圈（四家各做莊一次）</option>
            <option value="2">2 圈</option>
            <option value="4">1 將（4 圈）</option>
          </select>
        </label>
        <label class="toggle">
          <input id="cfg-dice" type="checkbox">
          <span>開啟骰規<small>（全紅／順子 +1 台、豹子翻倍）</small></span>
        </label>
        </div>
        <label>每步思考時間
          <select id="cfg-turn">
            <option value="15">15 秒</option>
            <option value="20" selected>20 秒</option>
            <option value="30">30 秒</option>
            <option value="60">60 秒</option>
            <option value="0">不限時</option>
          </select>
        </label>
        <p id="cfg-hint" class="sub"></p>
      </div>

      <button id="btn-start" class="primary" disabled>開始遊戲</button>
      <p id="wait-hint" class="sub"></p>
      <button id="btn-leave-room" class="ghost small-btn">離開房間</button>
      </div>
    </div>
  </section>

  <!-- 牌桌 -->
  <section id="table" class="screen">
    <div id="rotate-hint">
      <div class="rot-emoji">📱</div>
      <p>請將手機橫放</p>
      <small>橫向才能把 17 張牌一次排開</small>
    </div>
    <div id="board">
      <div id="table-ctrl">
        <button id="btn-restart" title="重新洗牌發牌（分數保留）">↻ 重開</button>
        <button id="btn-leave-game" title="退出牌局回大廳">✕ 離開</button>
      </div>
      <div class="info-bar">
        <span id="info-round"></span>
        <span id="info-wall"></span>
        <span id="info-turn"></span>
        <span id="info-dice"></span>
        <span id="info-last"></span>
        <button id="btn-sound" title="音效開關">🔊</button>
        <button id="btn-fs" title="全螢幕">⛶</button>
      </div>

      <div class="seat-area top" data-pos="top"></div>
      <div class="seat-area left" data-pos="left"></div>
      <div class="seat-area right" data-pos="right"></div>

      <div id="center-pool"></div>
      <div id="turn-pointer" aria-hidden="true"></div>

      <div class="seat-area bottom" data-pos="bottom">
        <div class="melds" id="my-melds"></div>
        <div class="hand" id="my-hand"></div>
      </div>

      <div id="action-bar"></div>
    </div>

    <!-- 結算 -->
    <div id="result-overlay" class="overlay">
      <div class="result-card">
        <h2 id="result-title"></h2>
        <div id="result-detail"></div>
        <table id="score-table"></table>
        <button id="btn-next" class="primary">下一局</button>
        <p id="next-hint" class="sub"></p>
      </div>
    </div>
  </section>

  <!-- 德州撲克牌桌 -->
  <section id="poker" class="screen">
    <div id="pk-board">
      <div id="pk-ctrl">
        <button id="pk-leave" title="退出牌局回大廳">✕ 離開</button>
        <button id="pk-settle" title="查看目前輸贏">📊 結算</button>
        <button id="pk-next" title="開下一手">▶ 下一手</button>
        <button id="pk-bomb" title="下一手改打炸彈彩池">💣 炸彈</button>
      </div>

      <!-- 遊戲結算面板 -->
      <div id="pk-settle-panel" class="overlay">
        <div class="result-card">
          <h2>📊 遊戲結算</h2>
          <table id="pk-settle-table"></table>
          <p class="sub">淨輸贏 ＝ 目前籌碼 −（起始籌碼 ＋ 補碼）</p>
          <button id="pk-settle-close" class="primary">關閉</button>
        </div>
      </div>
      <div class="pk-info">
        <span id="pk-blinds"></span>
        <span id="pk-handno"></span>
        <span id="pk-phase"></span>
      </div>

      <div id="pk-seats"></div>

      <div id="pk-center">
        <div id="pk-pot"></div>
        <div id="pk-board-cards"></div>
        <div id="pk-msg"></div>
      </div>

      <div id="pk-me">
        <div id="pk-hole"></div>
        <div id="pk-actions"></div>
      </div>
    </div>
  </section>

  <script src="/static/tiles.js"></script>
  <script src="/static/sounds.js"></script>
  <script src="/static/poker_ui.js"></script>
  <script src="/static/client.js"></script>
</body>
</html>
